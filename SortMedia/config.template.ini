# SortMedia Configuration File (TEMPLATE)
# 
# IMPORTANT: Do not commit this to git!
# After editing, encrypt with: .\Encrypt-Config.ps1
# To use, decrypt with: .\Decrypt-Config.ps1

[Paths]
# Replace with your actual folder paths
SourceFolder=C:\path\to\source\folder
DestinationFolder=D:\path\to\destination
ToDeleteFolder=C:\path\to\delete\folder
LogFolder=D:\path\to\logs

[FileTypes]
PhotoExtensions=jpg,jpeg,png,heic,raw,tiff
VideoExtensions=mp4,mov,avi,mkv,wmv

[Processing]
ProgressInterval=200
LogDuplicates=true
OrganizeByCategory=false

[Holidays]
# Format: EventName=StartDate,EndDate
# Dates must be in YYYY-MM-DD format
# End date is inclusive (becomes end of day)
# Example:
# Beach Trip 2024=2024-07-15,2024-07-22
# Europe 2025=2025-06-01,2025-08-30

Mila Mila=2006-05-14,2006-05-14
Skotsko=2008-04-19,2008-05-06
